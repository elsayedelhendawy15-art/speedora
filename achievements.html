<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإنجازات | Speedora</title>
<link rel="stylesheet" href="styles.css">
<style>
  .ach-summary { background: linear-gradient(135deg, #2a1b50, #101831); border: 1px solid #5a3b83; border-radius: var(--radius); padding: 22px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .ach-summary h2 { margin: 0 0 4px; font-size: 18px; }
  .ach-summary p { margin: 0; color: var(--muted); font-size: 12px; }
  .ach-summary .count { font-size: 36px; font-weight: 900; background: linear-gradient(135deg, #ffca62, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .ach-card { background: linear-gradient(145deg, rgba(17, 26, 52, 0.7), rgba(11, 18, 37, 0.9)); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 20px; text-align: center; position: relative; transition: var(--transition); }
  .ach-card.unlocked { border-color: var(--gold); background: linear-gradient(145deg, rgba(42, 31, 10, 0.8), rgba(11, 18, 37, 0.9)); box-shadow: 0 0 20px rgba(245, 158, 11, 0.15); }
  .ach-card:hover { transform: translateY(-3px); }
  .ach-icon { font-size: 42px; margin-bottom: 10px; opacity: 0.4; transition: 0.3s; }
  .ach-card.unlocked .ach-icon { opacity: 1; filter: drop-shadow(0 0 12px rgba(255, 202, 98, 0.8)); }
  .ach-card h3 { font-size: 15px; margin: 0 0 4px; color: var(--purple-2); }
  .ach-card p { font-size: 12px; color: var(--muted); margin: 0 0 12px; min-height: 34px; }
  .ach-reward { font-size: 13px; font-weight: 800; color: var(--green); }
  .ach-status { position: absolute; top: 12px; left: 12px; font-size: 18px; }
  .ach-card.locked { filter: grayscale(0.8); opacity: 0.7; }
</style>
</head>
<body data-page="achievements">
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="index.html"><span class="bolt">ϟ</span><span>Speedora<small>Play. Complete. Earn.</small></span></a>
    <nav class="nav">
      <a href="index.html">⌂ Home</a>
      <a href="games.html">🎮 Games</a>
      <a href="earn.html">▤ Earn</a>
      <a href="rewards.html">🎁 Rewards</a>
      <a href="wheel.html">🎡 Wheel</a>
      <a class="active" href="achievements.html">🏅 Achievements</a>
      <a href="leaderboard.html">🏆 Leaderboard</a>
      <a href="wallet.html">▣ Wallet</a>
      <a href="profile.html">♙ Profile</a>
    </nav>
    <div class="sidefoot">© 2026 Speedora</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu" id="menu">☰</button>
      <div class="crumb">Achievements</div>
      <div class="actions"><a class="user" href="profile.html"><span class="avatar">A</span><span><b id="userName">Player</b><br><small id="userBalance">0 pts</small></span></a></div>
    </header>
    <main class="content">
      <div class="pagehead">
        <div><span class="eyebrow">TROPHIES</span><h1>الإنجازات</h1><p>اجمع الشارات واحصل على مكافآت إضافية</p></div>
      </div>

      <div class="ach-summary">
        <div>
          <h2>الشارات المُفتوحة</h2>
          <p id="summaryText">-</p>
        </div>
        <div class="count" id="achCount">0 / 0</div>
      </div>

      <div class="ach-grid" id="achGrid"></div>
    </main>
  </div>
</div>

<script src="core.js?v=12"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-US');

function render() {
  const s = Speedora.get();
  const achs = Speedora.getAchievements();
  const unlocked = achs.filter(a => a.unlocked).length;
  const total = achs.length;
  const totalRewards = achs.filter(a => a.unlocked).reduce((sum, a) => sum + a.reward, 0);

  $('achCount').textContent = `${unlocked} / ${total}`;
  $('summaryText').textContent = `حصلت على ${fmt(totalRewards)} نقطة من الإنجازات`;
  $('userBalance').textContent = fmt(s.balance) + ' pts';
  $('userName').textContent = Speedora.getUserName();

  $('achGrid').innerHTML = achs.map(a => `
    <div class="ach-card ${a.unlocked ? 'unlocked' : 'locked'}">
      <div class="ach-status">${a.unlocked ? '✅' : '🔒'}</div>
      <div class="ach-icon">${a.icon}</div>
      <h3>${a.title}</h3>
      <p>${a.desc}</p>
      <div class="ach-reward">+${fmt(a.reward)} نقطة</div>
    </div>
  `).join('');
}

window.addEventListener('pointsUpdated', render);
window.addEventListener('achievementUnlocked', render);
$('menu')?.addEventListener('click', () => document.querySelector('.sidebar')?.classList.toggle('open'));
render();
</script>
</body>
</html>
