<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المتصدرين | Speedora</title>
<link rel="stylesheet" href="styles.css">
<style>
  .lb-hero { background: radial-gradient(ellipse at 50% 30%, #5a29ad77, transparent 60%), #111832; border: 1px solid #3b2c76; border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 20px; }
  .lb-hero .trophy { font-size: 60px; margin-bottom: 10px; }
  .lb-hero h2 { margin: 0 0 6px; font-size: 24px; }
  .lb-hero p { margin: 0; color: var(--muted); font-size: 13px; }
  
  .lb-list { display: flex; flex-direction: column; gap: 8px; }
  .lb-row { background: linear-gradient(145deg, rgba(17, 26, 52, 0.7), rgba(11, 18, 37, 0.9)); border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: 14px 18px; display: flex; align-items: center; gap: 14px; transition: var(--transition); }
  .lb-row:hover { border-color: var(--purple); transform: translateX(-4px); }
  .lb-row.user { background: linear-gradient(90deg, #43228e, #2a1458); border-color: var(--purple-2); box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
  
  .lb-rank { font-size: 22px; font-weight: 800; width: 40px; text-align: center; color: var(--muted); }
  .lb-row:nth-child(1) .lb-rank { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
  .lb-row:nth-child(2) .lb-rank { color: #c0c0c0; }
  .lb-row:nth-child(3) .lb-rank { color: #cd7f32; }
  
  .lb-avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--purple), var(--pink)); font-weight: 800; color: white; font-size: 18px; }
  .lb-row:nth-child(1) .lb-avatar { background: linear-gradient(135deg, #fbbf24, #d97706); }
  .lb-row:nth-child(2) .lb-avatar { background: linear-gradient(135deg, #e5e7eb, #6b7280); }
  .lb-row:nth-child(3) .lb-avatar { background: linear-gradient(135deg, #cd7f32, #92400e); }
  
  .lb-name { flex: 1; font-weight: 700; font-size: 14px; }
  .lb-name small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .lb-pts { font-size: 16px; font-weight: 800; color: var(--cyan); }
  .lb-row.user .lb-pts { color: var(--gold); }
</style>
</head>
<body data-page="leaderboard">
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="index.html"><span class="bolt">ϟ</span><span>Speedora<small>Play. Complete. Earn.</small></span></a>
    <nav class="nav">
      <a href="index.html">⌂ Home</a>
      <a href="games.html">🎮 Games</a>
      <a href="earn.html">▤ Earn</a>
      <a href="rewards.html">🎁 Rewards</a>
      <a href="wheel.html">🎡 Wheel</a>
      <a href="achievements.html">🏅 Achievements</a>
      <a class="active" href="leaderboard.html">🏆 Leaderboard</a>
      <a href="wallet.html">▣ Wallet</a>
      <a href="profile.html">♙ Profile</a>
    </nav>
    <div class="sidefoot">© 2026 Speedora</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu" id="menu">☰</button>
      <div class="crumb">Leaderboard</div>
      <div class="actions"><a class="user" href="profile.html"><span class="avatar">A</span><span><b id="userName">Player</b><br><small id="userBalance">0 pts</small></span></a></div>
    </header>
    <main class="content">
      <div class="pagehead">
        <div><span class="eyebrow">GLOBAL RANKING</span><h1>المتصدرين</h1><p>أفضل اللاعبين هذا الأسبوع</p></div>
      </div>

      <div class="lb-hero">
        <div class="trophy">🏆</div>
        <h2>التصنيف العالمي</h2>
        <p>احتل مكانك بين أفضل اللاعبين</p>
      </div>

      <div class="lb-list" id="lbList"></div>
    </main>
  </div>
</div>

<script src="core.js?v=12"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-US');

function render() {
  const s = Speedora.get();
  $('userBalance').textContent = fmt(s.balance) + ' pts';
  $('userName').textContent = Speedora.getUserName();

  const list = Speedora.getLeaderboard('أنت');
  $('lbList').innerHTML = list.map((u, i) => `
    <div class="lb-row ${u.isUser ? 'user' : ''}">
      <div class="lb-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1)}</div>
      <div class="lb-avatar">${u.avatar}</div>
      <div class="lb-name">${u.name}${u.isUser ? ' (أنت)' : ''}<small>${u.isUser ? 'مستواك' : 'لاعب'}</small></div>
      <div class="lb-pts">${fmt(u.points)}</div>
    </div>
  `).join('');
}

window.addEventListener('pointsUpdated', render);
$('menu')?.addEventListener('click', () => document.querySelector('.sidebar')?.classList.toggle('open'));
render();
</script>
</body>
</html>
