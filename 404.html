<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - الصفحة غير موجودة | Speedora</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .error-box { max-width: 500px; }
  .error-code { font-size: 120px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--purple-2), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  .error-title { font-size: 24px; margin-bottom: 10px; }
  .error-desc { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .btn { padding: 14px 32px; font-size: 15px; }
</style>
</head>
<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <h1 class="error-title">ضل الطريق؟ 🧭</h1>
    <p class="error-desc">الصفحة اللي بتحاول توصلها مش موجودة أو اتنقلت. ممكن ترجع الرئيسية وتكمل لعب.</p>
    <a href="index.html" class="btn">العودة للرئيسية</a>
  </div>
</body>
</html>
